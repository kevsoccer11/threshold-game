<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>THRESHOLD: Couples Exploration & Relationship Game</title>
  
  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@lucide/web@latest"></script>

  <style>
    :root {
      --bg-dark: #08080a;
      --card-bg: #121216;
      --card-border: rgba(255, 255, 255, 0.08);
      --text-main: #f3f3f6;
      --text-muted: #8e8e9f;
      --accent-sexuality: #e63946;
      --accent-sexuality-glow: rgba(230, 57, 70, 0.15);
      --accent-life: #2a9d8f;
      --accent-life-glow: rgba(42, 157, 143, 0.15);
      --current-accent: var(--accent-sexuality);
      --current-glow: var(--accent-sexuality-glow);
      --radius-lg: 24px;
      --radius-md: 14px;
      --radius-sm: 8px;
      --transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 16px;
      overflow-x: hidden;
      position: relative;
    }

    /* Ambient Glow Background */
    .ambient-bg {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 350px;
      height: 350px;
      background: var(--current-glow);
      filter: blur(100px);
      border-radius: 50%;
      z-index: 0;
      pointer-events: none;
      transition: var(--transition);
    }

    /* Header & Module Switcher */
    header {
      width: 100%;
      max-width: 480px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .app-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--text-main);
      text-transform: uppercase;
    }

    .header-actions {
      display: flex;
      gap: 8px;
    }

    .icon-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      width: 38px;
      height: 38px;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: var(--transition);
    }

    .icon-btn:active {
      transform: scale(0.92);
      background: rgba(255, 255, 255, 0.1);
    }

      grid-template-columns: 1fr 1fr;
      background: rgba(255, 255
